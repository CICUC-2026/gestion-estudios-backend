name: Validación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gestion_estudios_pruebas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestion_estudios_pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CICUC_BASE_DATOS_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gestion_estudios_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest
      - run: alembic upgrade head --sql > /tmp/migracion.sql
      - run: docker build .
