name: Validación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest
      - run: alembic upgrade head --sql > /tmp/migracion.sql
      - run: docker build .
